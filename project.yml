name: SportFit
options:
  bundleIdPrefix: com.hydepx
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  SportFit:
    type: application
    platform: iOS
    sources:
      - path: SportFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydepx.sportfit
        INFOPLIST_KEY_CFBundleDisplayName: SportFit
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: SportFit использует данные Apple Здоровье только с вашего разрешения для отображения прогресса.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Доступ к записи в Здоровье не используется в первой версии.
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    entitlements:
      path: SportFit/SportFit.entitlements
