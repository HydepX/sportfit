name: SportFit
options:
  bundleIdPrefix: com.hydepx
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  SportFit:
    type: application
    platform: iOS
    info:
      path: Generated/SportFit-Info.plist
      properties:
        SportFitHealthKitEnabled: false
        SportFitBuildCommit: '$(SPORTFIT_BUILD_COMMIT)'
    sources:
      - path: SportFit
        excludes:
          - Resources/media
      - path: SportFit/Resources/media
        type: folder
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ""
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        PRODUCT_BUNDLE_IDENTIFIER: com.hydepx.sportfit
        INFOPLIST_KEY_CFBundleDisplayName: SportFit
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  SportFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: SportFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SportFitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: SportFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SportFit:
    build:
      targets:
        SportFit: all
    test:
      targets:
        - SportFitTests
        - SportFitUITests
